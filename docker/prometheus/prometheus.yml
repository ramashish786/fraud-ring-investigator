global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels: {system: fraud-ring-investigator}

rule_files:
  - /etc/prometheus/rules/*.rules.yml

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs: [{targets: ["api:8000"]}]
  - job_name: worker
    static_configs: [{targets: ["worker:9101"]}]
