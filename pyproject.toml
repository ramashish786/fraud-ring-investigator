[project]
name = "fraud-ring-investigator"
version = "0.1.0"
description = "AI-assisted fraud ring investigation platform (FastAPI, PostgreSQL, Neo4j, LangGraph, OpenAI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "neo4j>=5.25",
    "structlog>=24.1",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    # LLM + agents (D-010, D-011)
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=3.0",
    "psycopg[binary,pool]>=3.2",
    # RAG
    "pypdf>=5.0",
    # observability
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "prometheus-client>=0.20",
    # simulation + offline baseline
    "numpy>=2.0",
    "pandas>=2.2",
    "networkx>=3.4",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "workers", "simulation"]

[tool.hatch.build.targets.wheel.force-include]
"config" = "config"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: needs a running PostgreSQL (TEST_DATABASE_URL) or Neo4j (TEST_NEO4J_URI)",
]
filterwarnings = ["ignore::DeprecationWarning:pandas.*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["data", "simulation/neo4j_legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]
ignore = ["S101", "UP046", "UP047"]  # assert is fine; classic Generic/TypeVar style kept for readability

[tool.ruff.lint.per-file-ignores]
"simulation/**" = ["S311", "E701", "E702", "B023", "RUF005", "SIM108", "S110", "E741", "E501", "B007", "B905", "RUF059"]  # slice-1 research code moved as-is (D-015)
"tests/**" = ["S105", "S106"]
"app/evaluation/**" = ["ASYNC240"]  # offline CLI tooling, blocking file I/O is fine
"app/seed.py" = ["ASYNC240"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app", "workers"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "pandas.*", "networkx.*", "numpy.*"]
ignore_missing_imports = true
